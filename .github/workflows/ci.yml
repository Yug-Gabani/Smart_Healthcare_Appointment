name: CI

# Runs on every PR targeting main_v2/main, and on every push to those branches.
# Keeps Vercel + Render honest: if either job fails, the "Merge" button turns red and
# (with branch protection enabled) the PR cannot be merged.

on:
  pull_request:
    branches: [main_v2, main]
  push:
    branches: [main_v2, main]

# Cancel stale runs when a new commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (JDK 21 + Maven tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile
        working-directory: apps/backend
        run: mvn -B -ntp -q compile

      - name: Run tests
        working-directory: apps/backend
        # H2 in-memory profile — no Postgres container needed in CI.
        run: mvn -B -ntp test

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: apps/backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend (Vite + TypeScript build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Build (TypeScript check + Vite production bundle)
        working-directory: apps/frontend
        run: npm run build

  ai-service:
    name: AI service (Python 3.11 syntax + import check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/ai-service/requirements.txt

      - name: Install dependencies
        working-directory: apps/ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile every .py file (catches syntax errors)
        working-directory: apps/ai-service
        run: python -m compileall -q .

      - name: Import smoke test (loads FastAPI app without starting server)
        working-directory: apps/ai-service
        # OPENROUTER_API_KEY is deliberately absent — main.py must import cleanly
        # without it (the module only needs the key at request time).
        run: python -c "import main; assert main.app is not None"

      - name: Run pytest if tests exist
        working-directory: apps/ai-service
        run: |
          if compgen -G "test_*.py" > /dev/null || compgen -G "tests/test_*.py" > /dev/null; then
            pip install pytest
            pytest -q
          else
            echo "No pytest tests found yet — skipping."
          fi
