name: CI

# Runs on every PR targeting main_v2/main, and on every push to those branches.
# Keeps Vercel + Render honest: if either job fails, the "Merge" button turns red and
# (with branch protection enabled) the PR cannot be merged.

on:
  pull_request:
    branches: [main_v2, main]
  push:
    branches: [main_v2, main]

# Cancel stale runs when a new commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (JDK 21 + Maven tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile
        working-directory: apps/backend
        run: mvn -B -ntp -q compile

      - name: Run tests
        working-directory: apps/backend
        # H2 in-memory profile — no Postgres container needed in CI.
        run: mvn -B -ntp test

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: apps/backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend (Vite + TypeScript build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Build (TypeScript check + Vite production bundle)
        working-directory: apps/frontend
        run: npm run build
