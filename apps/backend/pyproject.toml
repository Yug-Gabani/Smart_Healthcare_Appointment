# Implements: NFR-01, NFR-02
# Safety:    none
# Owner:     backend (Group 6)

[project]
name = "smart-healthcare-backend"
version = "0.1.0"
description = "Smart Healthcare Appointment & Triage System Backend"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "asyncpg==0.29.0",
    "alembic==1.13.3",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "fastapi-users[sqlalchemy]==13.0.0",
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]==3.3.0",
    "sse-starlette==2.1.3",
    "arq==0.26.1",
    "httpx==0.27.2",
    "structlog==24.4.0",
    "boto3==1.35.36",
    "stripe==10.12.0",
    "sentry-sdk==2.14.0",
    "langchain==0.3.1",
    "langchain-core>=0.3.6,<0.4.0",
    "langchain-openai==0.2.1",
    "langgraph==0.2.28",
    "langgraph-checkpoint-postgres==1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.6.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"
