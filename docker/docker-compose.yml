name: smart-healthcare

# -----------------------------------------------------------------------------
# Smart Healthcare Appointment — local infrastructure
#
# Default (no profile):
#   docker compose -f docker/docker-compose.yml up -d
#     → postgres + redis only (what the backend needs to boot in dev)
#
# With storage profile (MinIO S3 for async PDF receipt storage):
#   docker compose -f docker/docker-compose.yml --profile storage up -d
#
# With full profile (backend + ai-service containers too):
#   docker compose -f docker/docker-compose.yml --profile full up -d
#
# Kafka is intentionally NOT included. Spring boot Kafka listener auto-startup
# defaults to false (see application.yml / KAFKA_AUTO_STARTUP), so the app
# runs cleanly without a broker. Add a broker only if you are developing the
# payment-receipt async pipeline.
# -----------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    container_name: healthcare-postgres
    environment:
      POSTGRES_DB: healthcare
      POSTGRES_USER: healthcare
      POSTGRES_PASSWORD: healthcare
    # Host port 5432 clashes with a local Postgres install. Change the left
    # side to "5434:5432" if you already have Postgres running on 5432, and
    # point DB_URL at jdbc:postgresql://localhost:5434/healthcare.
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcare -d healthcare"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: healthcare-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: healthcare-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - storage
      - full

  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    container_name: healthcare-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/healthcare
      DB_USERNAME: healthcare
      DB_PASSWORD: healthcare
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Kafka is off by default; flip to true when a broker is present.
      KAFKA_AUTO_STARTUP: "false"
      KAFKA_TOPIC_AUTO_CREATE: "false"
      # AI service inside the compose network (full profile only).
      AI_SERVICE_URL: http://ai-service:8001
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    profiles:
      - full

  ai-service:
    build:
      context: ../apps/ai-service
      dockerfile: Dockerfile
    container_name: healthcare-ai-service
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-3.5-sonnet}
    ports:
      - "8001:8001"
    profiles:
      - full

volumes:
  postgres_data:
  redis_data:
  minio_data:
